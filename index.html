<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>RAJOUN AI CINEMATIC PORTFOLIO</title>

<meta name="description" content="Rajoun Ahmed Rijon - Elite Cinematic Frontend Developer Portfolio">
<meta name="theme-color" content="#ff1e1e">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>

:root{
--bg:#040404;
--card:rgba(255,255,255,.05);
--border:rgba(255,255,255,.08);
--text:#fff;
--muted:#a5a5a5;
--red:#ff1e1e;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Outfit',sans-serif;
background:var(--bg);
color:white;
overflow-x:hidden;
}

/* smooth glow background */
body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at top right, rgba(255,0,0,.15), transparent 40%),
radial-gradient(circle at bottom left, rgba(255,0,0,.1), transparent 40%);
z-index:-1;
}

/* particles */
#particles{
position:fixed;
inset:0;
z-index:-3;
opacity:.7;
}

.matrix{
position:fixed;
inset:0;
z-index:-2;
opacity:.06;
}

/* loader */
.loader{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:999999;
}

.loader h1{
font-size:6vw;
color:var(--red);
letter-spacing:10px;
}

.cursor{
width:16px;
height:16px;
background:var(--red);
position:fixed;
border-radius:50%;
pointer-events:none;
z-index:999999;
box-shadow:0 0 20px var(--red);
transform:translate(-50%,-50%);
}

.progress{
position:fixed;
top:0;
left:0;
height:3px;
background:var(--red);
width:0%;
z-index:99999;
box-shadow:0 0 20px var(--red);
}

/* NAV */
nav{
position:fixed;
top:0;
left:0;
width:100%;
padding:22px 7%;
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(20px);
background:rgba(0,0,0,.4);
z-index:9999;
}

nav a.active{
color:var(--red);
}

/* HERO FIX */
.hero h1{
font-size:8vw;
line-height:.9;
font-weight:900;
}

.hero h1 span{
color:transparent;
-webkit-text-stroke:1px var(--red);
}

/* button hover upgrade */
.btn:hover{
transform:translateY(-6px) scale(1.02);
}

/* scroll top */
#topBtn{
position:fixed;
bottom:25px;
right:25px;
width:50px;
height:50px;
border-radius:50%;
background:var(--red);
border:none;
color:white;
display:none;
z-index:9999;
}

/* mobile fix */
@media(max-width:900px){
.hero{grid-template-columns:1fr;}
.hero h1{font-size:14vw;}
}

</style>

</head>

<body>

<div class="loader">
<h1>RAJOUN</h1>
<p>LOADING ELITE SYSTEM</p>
</div>

<div class="cursor"></div>
<div class="progress"></div>

<canvas id="particles"></canvas>
<canvas class="matrix"></canvas>

<button id="topBtn">↑</button>

<!-- NAV -->
<nav>
<div class="logo">RAJOUN<span>.</span>RIJON</div>
</nav>

<!-- HERO -->
<section class="hero" id="home">

<div>
<h1>RAJOUN<br>AHMED<br><span>RIJON</span></h1>
<p>Next-gen cinematic developer building immersive digital experiences.</p>
</div>

</section>

<script>

/* loader */
setTimeout(()=>{
document.querySelector('.loader').style.display='none';
},1500);

/* cursor */
const cursor=document.querySelector('.cursor');
window.addEventListener('mousemove',e=>{
cursor.style.left=e.clientX+'px';
cursor.style.top=e.clientY+'px';
});

/* FIXED tilt bug */
const tilt=document.getElementById('tilt');
if(tilt){
window.addEventListener('mousemove',e=>{
const x=(window.innerWidth/2-e.pageX)/40;
const y=(window.innerHeight/2-e.pageY)/40;
tilt.style.transform=`rotateY(${x}deg) rotateX(${-y}deg)`;
});
}

/* progress bar */
window.addEventListener('scroll',()=>{
const total=document.body.scrollHeight-window.innerHeight;
document.querySelector('.progress').style.width=
(window.pageYOffset/total)*100+'%';
});

/* scroll top */
const topBtn=document.getElementById("topBtn");

window.addEventListener("scroll",()=>{
topBtn.style.display=window.scrollY>300?"block":"none";
});

topBtn.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

/* THREE FIXED */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('particles'),alpha:true});

renderer.setSize(innerWidth,innerHeight);

const geo=new THREE.BufferGeometry();
const vertices=[];

for(let i=0;i<4000;i++){
vertices.push(
THREE.MathUtils.randFloatSpread(2000),
THREE.MathUtils.randFloatSpread(2000),
THREE.MathUtils.randFloatSpread(2000)
);
}

geo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));

const mat=new THREE.PointsMaterial({color:0xff1e1e,size:1.5});
const points=new THREE.Points(geo,mat);
scene.add(points);

camera.position.z=500;

function animate(){
requestAnimationFrame(animate);
points.rotation.y+=0.0005;
renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

/* matrix optimized */
const canvas=document.querySelector('.matrix');
const ctx=canvas.getContext('2d');

canvas.width=innerWidth;
canvas.height=innerHeight;

const letters="RAJOUN01AI";
const size=14;
const cols=Math.floor(canvas.width/size);
const drops=new Array(cols).fill(1);

function draw(){
ctx.fillStyle="rgba(0,0,0,.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="red";
ctx.font=size+"px monospace";

for(let i=0;i<drops.length;i++){
const text=letters[Math.floor(Math.random()*letters.length)];
ctx.fillText(text,i*size,drops[i]*size);

if(drops[i]*size>canvas.height && Math.random()>0.975){
drops[i]=0;
}
drops[i]++;
}
}
setInterval(draw,40);

</script>

</body>
</html>
